  <div class="app-bar"><a href="https://surfingcoder.com/">SurfingCoder</a><a href="https://github.com/netcodermike/surfingcoder-cards">Game source ↗</a></div>
  <main>
    <h1>SurfingCoder <em>Cards</em></h1>
    <div class="modes" aria-label="Choose a card game" role="group">
      <button id="golf" aria-pressed="true">Golf Solitaire</button>
      <button id="eights" aria-pressed="false">Crazy Eights</button>
      <button id="deal">New deal</button>
    </div>
    <section class="table" aria-label="Card table">
      <div class="table-head">
        <h2 id="mode-title">Golf Solitaire</h2>
        <strong id="score"></strong>
      </div>
      <p id="status" role="status"></p>
      <div id="board"></div>
    </section>
    <details class="rules"><summary>How to play</summary><p id="rules"></p></details>
  </main>
