name: Capture expansion applications
on:
  workflow_dispatch:
    inputs:
      batch:
        description: 'Batch to validate and capture (1–4; 0 = all listed apps)'
        required: true
        default: '1'
        type: choice
        options: ['1', '2', '3', '4', '0']
  push:
    branches: [site/expansion40]
    paths: ['scripts/expansion40-inventory.json', 'scripts/capture_expansion.py', '.github/workflows/capture-expansion.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      batch: ${{ steps.select.outputs.batch }}
    steps:
      - uses: actions/checkout@v4
      - id: select
        name: Select the requested batch and toolchains
        env:
          INPUT_BATCH: ${{ inputs.batch }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY'
          import json, os, re
          rows = json.load(open('scripts/expansion40-inventory.json'))
          if isinstance(rows, dict): rows = rows.get('projects', list(rows.values()))
          marker = re.search(r'\[expansion-batch-([1-4])\]', os.environ.get('COMMIT_MESSAGE',''))
          raw = os.environ.get('INPUT_BATCH') or (marker[1] if marker else str(max(int(r['batch']) for r in rows)))
          batch = int(raw)
          if batch not in range(5): raise SystemExit('Batch must be 0–4')
          selected = [r for r in rows if not batch or int(r['batch']) == batch]
          if not selected: raise SystemExit('No applications for this batch')
          def group(row):
              if row.get('kind') in ('web','server'): return 'web'
              return {'Rust':'rust','Java':'jvm','Kotlin':'jvm','Swift':'swift'}.get(row['language'],'native')
          groups = sorted({group(r) for r in selected})
          matrix = {'include':[{'group':g,'runner':'macos-latest' if g=='swift' else 'ubuntu-24.04'} for g in groups]}
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('batch='+str(batch)+'\n')
              f.write('matrix='+json.dumps(matrix,separators=(',',':'))+'\n')
          print('Capturing', len(selected), 'applications across', ', '.join(groups))
          PY
  capture:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        if: matrix.group == 'web'
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        if: matrix.group == 'native'
        with:
          go-version: '1.24.x'
      - uses: actions/setup-dotnet@v5
        if: matrix.group == 'native'
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-java@v5
        if: matrix.group == 'jvm'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.group == 'jvm'
        with:
          gradle-version: '8.9'
      - name: Check native toolchains
        if: matrix.group == 'native'
        run: |
          gcc --version | head -1
          g++ --version | head -1
          ruby --version
          php --version | head -1
      - name: Select Rust stable
        if: matrix.group == 'rust'
        run: rustup default stable
      - name: Check Swift
        if: matrix.group == 'swift'
        run: swift --version
      - name: Install image capture dependencies
        run: python -m pip install pillow
      - name: Install browser capture dependencies
        if: matrix.group == 'web'
        run: |
          python -m pip install playwright
          timeout 180 python -m playwright install chromium
      - name: Validate apps and capture their actual behavior
        run: python scripts/capture_expansion.py --inventory scripts/expansion40-inventory.json --batch ${{ needs.prepare.outputs.batch }} --group ${{ matrix.group }} --output screenshots-expansion40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expansion40-batch-${{ needs.prepare.outputs.batch }}-${{ matrix.group }}
          path: screenshots-expansion40/
          if-no-files-found: error
          retention-days: 30
