name: Capture Python desktop interfaces
on:
  push:
    branches: [site/project-gallery]
    paths: ['.github/workflows/capture-python.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install native capture tools
        run: |
          sudo timeout 180 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 update
          sudo timeout 240 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 install -y --no-install-recommends xvfb openbox scrot wmctrl python3-tk
          python -m pip install pillow playwright
          timeout 180 python -m playwright install chromium
      - name: Capture actual interfaces
        run: xvfb-run -a -s '-screen 0 1440x1000x24' python scripts/capture_linux.py --inventory scripts/projects-inventory.json --output screenshots --group python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-linux-python
          path: screenshots/
